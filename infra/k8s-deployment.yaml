apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: python:3.10
        command: ["python", "/src/transaction_service.py"]
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /transfer?amount=1
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
